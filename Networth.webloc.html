<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<title>Ledger — Net Worth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0E1622;
    --ink-800:#161F2E;
    --ink-700:#1D2838;
    --paper:#EDE6D6;
    --paper-dim:#C9C2AF;
    --gold:#C9A15C;
    --gold-dim:#8A7040;
    --burgundy:#B5584A;
    --burgundy-dim:#7C3D33;
    --line: rgba(237,230,214,0.14);
    --line-strong: rgba(237,230,214,0.28);
    --text:#EDE6D6;
    --text-muted:#8F96A3;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink-900);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:48px;
  }
  .app{max-width:520px;margin:0 auto;padding:20px 18px 0;}

  header.top{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:6px 2px 18px;border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  header.top .brand{
    font-family:'Fraunces', serif;font-weight:600;font-size:22px;letter-spacing:0.01em;
  }
  header.top .brand span{color:var(--gold);}
  header.top .date{
    font-family:'IBM Plex Mono', monospace;font-size:11.5px;color:var(--text-muted);
    text-transform:uppercase;letter-spacing:0.08em;
  }

  /* Hero net worth */
  .hero{margin-bottom:34px;}
  .hero .label{
    font-family:'IBM Plex Mono', monospace;font-size:11px;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;
  }
  .hero .figure-row{
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  }
  .hero .figure{
    font-family:'Fraunces', serif;font-weight:500;font-size:44px;line-height:1;
    font-variant-numeric:tabular-nums;
    padding-bottom:10px;
    border-bottom:3px double var(--line-strong);
  }
  .hero .delta{
    font-family:'IBM Plex Mono', monospace;font-size:13px;padding-bottom:12px;white-space:nowrap;
  }
  .hero .delta.up{color:var(--gold);}
  .hero .delta.down{color:var(--burgundy);}
  .hero .delta.flat{color:var(--text-muted);}
  .sparkline{width:100%;height:54px;margin-top:14px;display:block;}

  /* Ledger sections */
  .ledger{margin-bottom:28px;}
  .ledger-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:2px;
  }
  .ledger-head h2{
    font-family:'Fraunces', serif;font-weight:500;font-size:17px;margin:0;
  }
  .ledger.assets .ledger-head h2::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:middle;}
  .ledger.liabilities .ledger-head h2::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--burgundy);margin-right:8px;vertical-align:middle;}
  .ledger-head .total{
    font-family:'IBM Plex Mono', monospace;font-size:14.5px;font-variant-numeric:tabular-nums;
  }
  .ledger.assets .ledger-head .total{color:var(--gold);}
  .ledger.liabilities .ledger-head .total{color:var(--burgundy);}

  .rows{border-top:1px solid var(--line);margin-top:10px;}
  .row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;border-bottom:1px solid var(--line);
    gap:10px;
  }
  .row .meta{min-width:0;}
  .row .name{font-size:14.5px;font-weight:500;color:var(--text);}
  .row .cat{font-family:'IBM Plex Mono', monospace;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
  .row .right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .row .balance{
    font-family:'IBM Plex Mono', monospace;font-size:15px;font-variant-numeric:tabular-nums;
    background:transparent;border:none;color:var(--text);text-align:right;width:104px;
    border-bottom:1px solid transparent;padding:2px 0;
  }
  .row .balance:focus{outline:none;border-bottom:1px solid var(--line-strong);}
  .row .del{
    background:none;border:none;color:var(--text-muted);font-size:16px;line-height:1;
    padding:6px;cursor:pointer;
  }
  .row .del:hover{color:var(--burgundy);}
  .row .del:focus-visible, .balance:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px;
  }

  .empty{
    padding:18px 0;color:var(--text-muted);font-size:13.5px;font-style:italic;
    border-bottom:1px solid var(--line);
  }

  .add-row{padding-top:10px;}
  .add-toggle{
    background:none;border:1px dashed var(--line-strong);color:var(--text-muted);
    font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:0.04em;
    padding:9px 12px;border-radius:var(--radius);width:100%;cursor:pointer;text-align:left;
  }
  .add-toggle:hover{color:var(--text);border-color:var(--gold-dim);}
  .add-form{
    display:none;gap:8px;margin-top:10px;flex-wrap:wrap;
    background:var(--ink-800);border:1px solid var(--line);border-radius:var(--radius);padding:12px;
  }
  .add-form.open{display:flex;}
  .add-form input[type=text], .add-form input[type=number], .add-form select{
    background:var(--ink-700);border:1px solid var(--line);color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;font-size:13.5px;padding:9px 10px;border-radius:7px;
    flex:1 1 100%;
  }
  .add-form input[type=number]{font-family:'IBM Plex Mono', monospace;}
  .add-form .fr{display:flex;gap:8px;flex:1 1 100%;}
  .add-form .fr > *{flex:1;}
  .add-form .save-btn{
    flex:1 1 100%;background:var(--gold);color:var(--ink-900);border:none;
    font-weight:600;font-size:13.5px;padding:10px;border-radius:7px;cursor:pointer;
  }
  .ledger.liabilities .add-form .save-btn{background:var(--burgundy);color:var(--paper);}
  .add-form .save-btn:hover{filter:brightness(1.08);}

  /* Snapshot bar */
  .snapshot-bar{
    margin:30px 0 30px;padding:16px;border:1px solid var(--line-strong);border-radius:var(--radius);
    background:var(--ink-800);display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .snapshot-bar .txt .t{font-family:'Fraunces', serif;font-size:15px;font-weight:500;}
  .snapshot-bar .txt .s{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .snapshot-btn{
    background:var(--paper);color:var(--ink-900);border:none;font-weight:600;
    font-family:'IBM Plex Sans', sans-serif;font-size:13px;padding:11px 16px;border-radius:8px;
    cursor:pointer;white-space:nowrap;
  }
  .snapshot-btn:hover{filter:brightness(0.95);}
  .snapshot-btn:disabled{opacity:0.5;cursor:default;}

  /* History */
  .history h2{
    font-family:'Fraunces', serif;font-weight:500;font-size:17px;margin:0 0 10px;
  }
  .hist-rows{border-top:1px solid var(--line);}
  .hist-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;
  }
  .hist-row .d{color:var(--text-muted);font-family:'IBM Plex Mono', monospace;font-size:11.5px;}
  .hist-row .n{font-family:'IBM Plex Mono', monospace;font-variant-numeric:tabular-nums;}
  .hist-row .del{margin-left:8px;}

  footer.note{
    text-align:center;color:var(--text-muted);font-size:11px;margin-top:36px;line-height:1.6;
  }

  ::selection{background:var(--gold-dim);color:var(--paper);}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">The <span>Ledger</span></div>
    <div class="date" id="todayDate"></div>
  </header>

  <section class="hero">
    <div class="label">Net Worth</div>
    <div class="figure-row">
      <div class="figure" id="netWorthFigure">$0</div>
      <div class="delta flat" id="netWorthDelta">no history yet</div>
    </div>
    <svg class="sparkline" id="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>
  </section>

  <section class="ledger assets">
    <div class="ledger-head">
      <h2>Assets</h2>
      <div class="total" id="assetsTotal">$0</div>
    </div>
    <div class="rows" id="assetsRows"></div>
    <div class="add-row">
      <button class="add-toggle" id="assetsToggle">+ add an asset</button>
      <div class="add-form" id="assetsForm">
        <div class="fr">
          <input type="text" id="assetName" placeholder="Name (e.g. Chase Checking)" />
        </div>
        <div class="fr">
          <select id="assetCategory">
            <option>Cash</option>
            <option>Investment</option>
            <option>Retirement</option>
            <option>Property</option>
            <option>Vehicle</option>
            <option>Other</option>
          </select>
          <input type="number" id="assetBalance" placeholder="Balance" inputmode="decimal" />
        </div>
        <button class="save-btn" id="assetSave">Add asset</button>
      </div>
    </div>
  </section>

  <section class="ledger liabilities">
    <div class="ledger-head">
      <h2>Liabilities</h2>
      <div class="total" id="liabilitiesTotal">$0</div>
    </div>
    <div class="rows" id="liabilitiesRows"></div>
    <div class="add-row">
      <button class="add-toggle" id="liabilitiesToggle">+ add a liability</button>
      <div class="add-form" id="liabilitiesForm">
        <div class="fr">
          <input type="text" id="liabName" placeholder="Name (e.g. Amex Card)" />
        </div>
        <div class="fr">
          <select id="liabCategory">
            <option>Credit Card</option>
            <option>Loan</option>
            <option>Mortgage</option>
            <option>Other</option>
          </select>
          <input type="number" id="liabBalance" placeholder="Balance" inputmode="decimal" />
        </div>
        <button class="save-btn" id="liabSave">Add liability</button>
      </div>
    </div>
  </section>

  <section class="snapshot-bar">
    <div class="txt">
      <div class="t">Record today's balance</div>
      <div class="s" id="snapshotSub">Saves a point in your history</div>
    </div>
    <button class="snapshot-btn" id="snapshotBtn">Save snapshot</button>
  </section>

  <section class="history">
    <h2>History</h2>
    <div class="hist-rows" id="histRows"></div>
  </section>

  <footer class="note">Stored privately, only visible to you.<br/>Add this page to your Home Screen for one-tap access.</footer>

</div>

<script>
const fmt = (n) => {
  const neg = n < 0;
  const v = Math.abs(Math.round(n));
  const s = '$' + v.toLocaleString('en-US');
  return neg ? '-' + s : s;
};

let accounts = [];
let snapshots = [];

async function loadData(){
  try{
    const a = await window.storage.get('accounts', false);
    accounts = a ? JSON.parse(a.value) : [];
  }catch(e){ accounts = []; }
  try{
    const s = await window.storage.get('snapshots', false);
    snapshots = s ? JSON.parse(s.value) : [];
  }catch(e){ snapshots = []; }
  render();
}

async function saveAccounts(){
  try{ await window.storage.set('accounts', JSON.stringify(accounts), false); }
  catch(e){ console.error('save accounts failed', e); }
}
async function saveSnapshots(){
  try{ await window.storage.set('snapshots', JSON.stringify(snapshots), false); }
  catch(e){ console.error('save snapshots failed', e); }
}

function totals(){
  const assetsTotal = accounts.filter(a=>a.type==='asset').reduce((s,a)=>s+Number(a.balance||0),0);
  const liabTotal = accounts.filter(a=>a.type==='liability').reduce((s,a)=>s+Number(a.balance||0),0);
  return { assetsTotal, liabTotal, netWorth: assetsTotal - liabTotal };
}

function renderRows(type, containerId){
  const container = document.getElementById(containerId);
  const rows = accounts.filter(a=>a.type===type);
  if(rows.length===0){
    container.innerHTML = `<div class="empty">No ${type==='asset'?'assets':'liabilities'} yet — add one below.</div>`;
    return;
  }
  container.innerHTML = '';
  rows.forEach(acc=>{
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="meta">
        <div class="name">${escapeHtml(acc.name)}</div>
        <div class="cat">${escapeHtml(acc.category)}</div>
      </div>
      <div class="right">
        <input class="balance" type="number" inputmode="decimal" value="${acc.balance}" data-id="${acc.id}" />
        <button class="del" data-id="${acc.id}" title="Delete" aria-label="Delete ${escapeHtml(acc.name)}">×</button>
      </div>
    `;
    container.appendChild(row);
  });
  container.querySelectorAll('.balance').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const id = e.target.dataset.id;
      const acc = accounts.find(a=>a.id===id);
      if(acc){ acc.balance = Number(e.target.value)||0; await saveAccounts(); render(); }
    });
  });
  container.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const id = e.target.dataset.id;
      accounts = accounts.filter(a=>a.id!==id);
      await saveAccounts(); render();
    });
  });
}

function renderSparkline(){
  const svg = document.getElementById('sparkline');
  if(snapshots.length < 2){ svg.innerHTML = ''; return; }
  const vals = snapshots.map(s=>s.netWorth);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const w = 100, h = 30, pad = 2;
  const pts = vals.map((v,i)=>{
    const x = (i/(vals.length-1)) * (w - pad*2) + pad;
    const y = h - pad - ((v - min)/range) * (h - pad*2);
    return `${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(' ');
  const lastUp = vals[vals.length-1] >= vals[0];
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="${lastUp?'#C9A15C':'#B5584A'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function renderHistory(){
  const container = document.getElementById('histRows');
  if(snapshots.length===0){
    container.innerHTML = `<div class="empty">No snapshots yet — record your first below.</div>`;
    return;
  }
  const sorted = [...snapshots].sort((a,b)=> new Date(b.date) - new Date(a.date));
  container.innerHTML = '';
  sorted.forEach(snap=>{
    const d = new Date(snap.date);
    const dstr = d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
    const row = document.createElement('div');
    row.className = 'hist-row';
    row.innerHTML = `
      <span class="d">${dstr}</span>
      <span class="n">${fmt(snap.netWorth)}</span>
      <button class="del" data-id="${snap.id}" title="Delete snapshot" aria-label="Delete snapshot">×</button>
    `;
    container.appendChild(row);
  });
  container.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const id = e.target.dataset.id;
      snapshots = snapshots.filter(s=>s.id!==id);
      await saveSnapshots(); render();
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function render(){
  const { assetsTotal, liabTotal, netWorth } = totals();
  document.getElementById('netWorthFigure').textContent = fmt(netWorth);
  document.getElementById('assetsTotal').textContent = fmt(assetsTotal);
  document.getElementById('liabilitiesTotal').textContent = fmt(liabTotal);

  const deltaEl = document.getElementById('netWorthDelta');
  if(snapshots.length===0){
    deltaEl.textContent = 'no history yet';
    deltaEl.className = 'delta flat';
  } else {
    const last = [...snapshots].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    const diff = netWorth - last.netWorth;
    if(Math.abs(diff) < 1){
      deltaEl.textContent = 'unchanged since last snapshot';
      deltaEl.className = 'delta flat';
    } else {
      deltaEl.textContent = (diff>0?'+':'') + fmt(diff) + ' since last snapshot';
      deltaEl.className = 'delta ' + (diff>0?'up':'down');
    }
  }

  renderRows('asset','assetsRows');
  renderRows('liability','liabilitiesRows');
  renderSparkline();
  renderHistory();

  const btn = document.getElementById('snapshotBtn');
  const sub = document.getElementById('snapshotSub');
  if(accounts.length===0){
    btn.disabled = true;
    sub.textContent = 'Add an account first';
  } else {
    btn.disabled = false;
    const today = new Date().toDateString();
    const already = snapshots.some(s=> new Date(s.date).toDateString() === today);
    sub.textContent = already ? "Today's snapshot already saved — saving again will update it" : "Saves a point in your history";
  }
}

// Toggle add-forms
document.getElementById('assetsToggle').addEventListener('click', ()=>{
  document.getElementById('assetsForm').classList.toggle('open');
});
document.getElementById('liabilitiesToggle').addEventListener('click', ()=>{
  document.getElementById('liabilitiesForm').classList.toggle('open');
});

document.getElementById('assetSave').addEventListener('click', async ()=>{
  const name = document.getElementById('assetName').value.trim();
  const category = document.getElementById('assetCategory').value;
  const balance = Number(document.getElementById('assetBalance').value)||0;
  if(!name) return;
  accounts.push({ id: 'a_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), name, category, type:'asset', balance });
  await saveAccounts();
  document.getElementById('assetName').value='';
  document.getElementById('assetBalance').value='';
  document.getElementById('assetsForm').classList.remove('open');
  render();
});

document.getElementById('liabSave').addEventListener('click', async ()=>{
  const name = document.getElementById('liabName').value.trim();
  const category = document.getElementById('liabCategory').value;
  const balance = Number(document.getElementById('liabBalance').value)||0;
  if(!name) return;
  accounts.push({ id: 'l_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), name, category, type:'liability', balance });
  await saveAccounts();
  document.getElementById('liabName').value='';
  document.getElementById('liabBalance').value='';
  document.getElementById('liabilitiesForm').classList.remove('open');
  render();
});

document.getElementById('snapshotBtn').addEventListener('click', async ()=>{
  const { assetsTotal, liabTotal, netWorth } = totals();
  const today = new Date().toDateString();
  const existingIdx = snapshots.findIndex(s=> new Date(s.date).toDateString() === today);
  const snap = {
    id: existingIdx>-1 ? snapshots[existingIdx].id : 'snap_'+Date.now(),
    date: new Date().toISOString(),
    assetsTotal, liabilitiesTotal: liabTotal, netWorth
  };
  if(existingIdx>-1){ snapshots[existingIdx] = snap; } else { snapshots.push(snap); }
  await saveSnapshots();
  render();
});

document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});

loadData();
</script>
</body>
</html>
